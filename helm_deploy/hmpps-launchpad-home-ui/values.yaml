---
generic-service:
  nameOverride: hmpps-launchpad-home-ui
  productId: "DPS026"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-launchpad-home-ui
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-launchpad-cert
    modsecurity_enabled: true
    modsecurity_github_team: 'hmpps-launchpad'
    annotations:
      nginx.ingress.kubernetes.io/server-snippet: |
        server_tokens off;
        location ~* /(etc|tmp|var|xampp|winnt|usr|proc|php)/ {
          deny all;
          return 401;
        }

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  custommetrics:
    enabled: true
    scrapeInterval: 15s
    metricsPath: /metrics
    metricsPort: 3001

  # Environment variables to load into the deployment
  env:
    NODE_ENV: 'production'
    REDIS_TLS_ENABLED: 'true'
    TOKEN_VERIFICATION_ENABLED: 'true'
    REFRESH_CHECK_TIMEOUT_IN_MINUTES: 1
    AUDIT_ENABLED: 'false'
    AUDIT_SERVICE_NAME: 'hmpps-launchpad-home-ui'
    AUDIT_SQS_REGION: 'eu-west-2'

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    hmpps-launchpad-home-ui-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: 'APPLICATIONINSIGHTS_CONNECTION_STRING'
    hmpps-launchpad-home-ui:
      LAUNCHPAD_API_CLIENT_ID: 'LAUNCHPAD_API_CLIENT_ID'
      LAUNCHPAD_API_CLIENT_SECRET: 'LAUNCHPAD_API_CLIENT_SECRET'
      SYSTEM_CLIENT_ID: 'SYSTEM_CLIENT_ID'
      SYSTEM_CLIENT_SECRET: 'SYSTEM_CLIENT_SECRET'
      SESSION_SECRET: 'SESSION_SECRET'
      SENTRY_DSN: 'SENTRY_DSN'
      FEATURE_ALLOW_BETA_ACCESS_TO_PRISONERS: 'FEATURE_ALLOW_BETA_ACCESS_TO_PRISONERS'
    elasticache-redis:
      REDIS_HOST: 'primary_endpoint_address'
      REDIS_AUTH_TOKEN: 'auth_token'
    sqs-hmpps-prisoner-audit-secret:
      AUDIT_SQS_QUEUE_URL: "sqs_queue_url"

  allowlist:
    groups:
      - internal

generic-prometheus-alerts:
  targetApplication: hmpps-launchpad-home-ui
