name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable or testing tags
        required: false
        default: ''
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  # Only cancel in progress when on a branch - use SHA on main to ensure uniqueness.
  # This will allow multiple pipelines to run at the same time on main.
  # Note that two pipelines running within a few minutes of each other will cause issues with helm deploying to
  # a namespace, as the second one will not be able to get a lock as a deploy will be in progress.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # main node build workflow
  node_build:
    name: node build
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_build.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      install_command: 'npm run setup'
  # generic node unit tests - feel free to override with local tests if required
  node_unit_tests:
    name: node unit tests
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_unit_tests.yml@v2 # WORKFLOW_VERSION
    needs: [node_build]
    secrets: inherit
  # Playwright E2E tests in mock mode
  node_integration_tests:
    name: node integration tests
    needs: [node_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Start test infrastructure
        run: docker compose -f docker-compose-test.yml up -d --wait

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npm run int-test-init:ci

      - name: Start mock app
        env:
          MOCK_AUTH: 'true'
          PORT: '3000'
          BASE_URL: 'http://localhost:3000'
          REDIS_URL: 'redis://localhost:6379'
          WIREMOCK_BASE_URL: 'http://localhost:9091'
          LAUNCHPAD_AUTH_URL: 'http://localhost:9091'
          HMPPS_AUTH_URL: 'http://localhost:9091/auth'
          TOKEN_VERIFICATION_API_URL: 'http://localhost:9091/verification'
          TOKEN_VERIFICATION_ENABLED: 'true'
          PRISON_API_URL: 'http://localhost:9091'
          INCENTIVES_API_URL: 'http://localhost:9091'
          ADJUDICATIONS_API_URL: 'http://localhost:9091'
        run: |
          set -euo pipefail

          if pgrep -af "dist/server.js" >/dev/null 2>&1; then
            pkill -f "dist/server.js" || true
          fi

          nohup env \
            MOCK_AUTH=true \
            PORT=3000 \
            BASE_URL=http://localhost:3000 \
            REDIS_URL=redis://localhost:6379 \
            WIREMOCK_BASE_URL=http://localhost:9091 \
            LAUNCHPAD_AUTH_URL=http://localhost:9091 \
            HMPPS_AUTH_URL=http://localhost:9091/auth \
            TOKEN_VERIFICATION_API_URL=http://localhost:9091/verification \
            TOKEN_VERIFICATION_ENABLED=true \
            PRISON_API_URL=http://localhost:9091 \
            INCENTIVES_API_URL=http://localhost:9091 \
            ADJUDICATIONS_API_URL=http://localhost:9091 \
            node --env-file=feature.env dist/server.js > /tmp/app.log 2>&1 &

          APP_PID=$!
          echo "App started with PID: $APP_PID"

          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl --fail --silent http://localhost:3000/health >/dev/null 2>&1; then
              echo "App is ready!"
              exit 0
            fi
            if curl --fail --silent http://localhost:3000/sign-in >/dev/null 2>&1; then
              echo "App is ready on sign-in route!"
              exit 0
            fi
            echo "Waiting for app to be ready... (attempt $((attempt+1))/$max_attempts)"
            sleep 2
            attempt=$((attempt+1))
          done

          echo "App failed to start in time"
          cat /tmp/app.log
          exit 1

      - name: Run the integration tests
        env:
          BASE_URL: 'http://localhost:3000'
          REGRESSION: 'true'
          CI: 'true'
        run: npm run int-test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/*
            test-results/results.xml

  node_integration_tests_status:
    name: node integration tests / Run the integration tests
    needs: [node_integration_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Run the integration tests
        run: |
          if [[ "${{ needs.node_integration_tests.result }}" == "success" ]]; then
            echo "Integration tests passed"
            exit 0
          fi
          echo "node_integration_tests result: ${{ needs.node_integration_tests.result }}"
          exit 1
  helm_lint:
    strategy:
      matrix:
        environments: ['dev', 'staging', 'preprod', 'prod']
    name: helm lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}
  build:
    name: Build docker image from hmpps-github-actions
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2 # WORKFLOW_VERSION
    needs:
      - node_integration_tests
      - node_unit_tests
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      push: ${{ inputs.push || inputs.push == null }}
      docker_multiplatform: false
      generate_sbom: true
      attach_sbom_to_registry: true
      sign_image: true
  deploy_dev:
    name: Deploy to the dev environment
    needs:
      - build
      - helm_lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'dev'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_staging:
    name: Deploy to the staging environment
    needs:
      - build
      - deploy_dev
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'staging'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_preprod:
    name: Deploy to the preprod environment
    needs:
      - build
      - deploy_staging
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'preprod'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_prod:
    name: Deploy to the prod environment
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - deploy_preprod
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'prod'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'true' # if 'true', it needs a valid PROD_RELEASES_SLACK_CHANNEL variable to be set
